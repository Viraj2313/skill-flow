<body class="flex flex-col min-h-screen text-on-surface dot-grid-opacity overflow-hidden">
<!-- Main Onboarding Content -->

<!-- Central Icon Component -->

<span class="material-symbols-outlined fill-gold text-[80px]" data-icon="workspace_premium" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<!-- Typography Content -->
<h2 class="font-h2 text-h2 text-on-surface mb-md">Climb the Ranks</h2>
<p class="font-body text-body text-on-surface-variant max-w-[280px]">
                Earn XP, build streaks, and compete on the global leaderboard. Prove your logic. Achieve Grandmaster.
            </p>
<!-- Leaderboard Visualization (Bento-style snippet) -->
<div class="mt-xl w-full grid grid-cols-1 gap-base">
<div class="paper-card p-sm rounded-lg flex items-center justify-between opacity-50 scale-95 translate-y-4">
<div class="flex items-center gap-sm">
<span class="font-label-caps text-label-caps text-outline">#04</span>
<div class="w-8 h-8 rounded-full bg-surface-container-high"></div>

</div>
<span class="font-stat-lg text-stat-lg text-primary">2,450 XP</span>
</div>
<div class="paper-card p-sm rounded-lg flex items-center justify-between border-primary/30 z-20">
<div class="flex items-center gap-sm">
<span class="font-label-caps text-label-caps text-primary">#05</span>
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed font-bold">U</div>
<span class="font-body text-body font-semibold">You</span>
</div>
<span class="font-stat-lg text-stat-lg text-primary">2,120 XP</span>
</div>
<div class="paper-card p-sm rounded-lg flex items-center justify-between opacity-50 scale-95 -translate-y-4">
<div class="flex items-center gap-sm">
<span class="font-label-caps text-label-caps text-outline">#06</span>
<div class="w-8 h-8 rounded-full bg-surface-container-high"></div>

</div>

</div>
</div>

<!-- Bottom Action Section -->

<!-- Page Indicator Dots -->

<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>

</div>
<!-- Call to Action Buttons -->
<div class="w-full max-w-md flex flex-col gap-sm">
<!-- Primary CTA -->
<button class="w-full h-[52px] bg-primary-container text-on-primary font-label-caps text-label-caps rounded-lg flex items-center justify-center gap-xs shadow-sm active:scale-95 transition-all duration-200">
                GET STARTED
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary CTA -->
<button class="w-full h-[44px] border border-primary-container text-primary-container font-label-caps text-label-caps rounded-lg flex items-center justify-center active:bg-primary-container/5 transition-all duration-200">
                I ALREADY HAVE AN ACCOUNT
            </button>
</div>
</footer>
<script>
        // Micro-interaction for the central card
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.paper-card.transform');
            
            // Add a subtle floating animation via JS
            let angle = 0;
            const animate = () => {
                angle += 0.05;
                const yOffset = Math.sin(angle) * 5;
                if(card) {
                    card.style.transform = `translateY(${yOffset}px) rotate(3deg)`;
                }
                requestAnimationFrame(animate);
            };
            requestAnimationFrame(animate);

            // Button Ripple Effect simulation
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const x = e.clientX - e.target.offsetLeft;
                    const y = e.clientY - e.target.offsetTop;
                    
                    const ripple = document.createElement('span');
                    ripple.style.position = 'absolute';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.style.width = '0px';
                    ripple.style.height = '0px';
                    ripple.style.borderRadius = '50%';
                    ripple.style.backgroundColor = 'rgba(255,255,255,0.2)';
                    ripple.style.transform = 'translate(-50%, -50%)';
                    ripple.style.transition = 'width 0.4s ease-out, height 0.4s ease-out, opacity 0.4s ease-out';
                    
                    this.style.overflow = 'hidden';
                    this.style.position = 'relative';
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.style.width = '300px';
                        ripple.style.height = '300px';
                        ripple.style.opacity = '0';
                    }, 0);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 500);
                });
            });
        });
    </script>
