<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #fafaf1;
            background-image: radial-gradient(#1c1917 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            background-attachment: fixed;
        }
        .dot-overlay {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(#1c1917 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .toggle-checkbox:checked + .toggle-slot {
            background-color: #426124;
        }
        .toggle-checkbox:checked + .toggle-slot .toggle-dot {
            transform: translateX(20px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e8e9e0",
                        "primary": "#426124",
                        "on-surface": "#1a1c17",
                        "surface": "#fafaf1",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f4f4eb",
                        "surface-variant": "#e3e3da",
                        "primary-fixed-dim": "#aed288",
                        "on-surface-variant": "#44483d",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c4c8b9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e3e3da",
                        "secondary": "#7b5800",
                        "error": "#ba1a1a",
                        "background": "#fafaf1",
                        "outline": "#74796b",
                        "on-background": "#1a1c17"
                    },
                    "spacing": {
                        "md": "16px",
                        "gutter": "16px",
                        "xs": "8px",
                        "tap_target": "44px",
                        "margin": "20px",
                        "sm": "12px",
                        "lg": "24px",
                        "xl": "32px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "h2": ["Inter"],
                        "h1": ["Inter"],
                        "body": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "code": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body": ["15px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h2": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h1": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface antialiased pb-24">
<div class="dot-overlay"></div>
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline transition-colors duration-200">
<div class="flex items-center px-margin h-tap_target w-full">
<button class="mr-4 p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-primary">Settings</h1>
</div>
</header>
<main class="max-w-md mx-auto">
<!-- Section: Account -->
<div class="mt-8">
<div class="px-margin mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">ACCOUNT</span>
</div>
<div class="bg-surface-container-lowest border-y border-outline-variant shadow-sm">
<!-- Row: Display Name -->
<button class="w-full flex items-center justify-between px-margin h-[56px] active:bg-surface-container-high transition-colors border-b border-outline-variant/30">
<span class="text-body text-on-surface">Display Name</span>
<div class="flex items-center gap-2">
<span class="text-body text-on-surface-variant">Alex Rivers</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Row: Username -->
<button class="w-full flex items-center justify-between px-margin h-[56px] active:bg-surface-container-high transition-colors">
<span class="text-body text-on-surface">Username</span>
<div class="flex items-center gap-2">
<span class="text-body text-on-surface-variant">arivers_92</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
</div>
<!-- Section: Notifications -->
<div class="mt-8">
<div class="px-margin mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">NOTIFICATIONS</span>
</div>
<div class="bg-surface-container-lowest border-y border-outline-variant shadow-sm">
<!-- Row: Daily Challenge Reminder -->
<div class="flex items-center justify-between px-margin h-[56px] border-b border-outline-variant/30">
<span class="text-body text-on-surface">Daily Challenge Reminder</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only toggle-checkbox" type="checkbox"/>
<div class="toggle-slot w-11 h-6 bg-surface-container-high rounded-full transition-colors duration-200">
<div class="toggle-dot absolute top-[2px] left-[2px] bg-white w-5 h-5 rounded-full transition-transform duration-200 shadow-sm"></div>
</div>
</label>
</div>
<!-- Row: Streak Alert -->
<div class="flex items-center justify-between px-margin h-[56px]">
<span class="text-body text-on-surface">Streak Alert</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only toggle-checkbox" type="checkbox"/>
<div class="toggle-slot w-11 h-6 bg-surface-container-high rounded-full transition-colors duration-200">
<div class="toggle-dot absolute top-[2px] left-[2px] bg-white w-5 h-5 rounded-full transition-transform duration-200 shadow-sm"></div>
</div>
</label>
</div>
</div>
</div>
<!-- Section: Appearance -->
<div class="mt-8">
<div class="px-margin mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">APPEARANCE</span>
</div>
<div class="bg-surface-container-lowest border-y border-outline-variant shadow-sm">
<!-- Row: Dark Mode -->
<button class="w-full flex items-center justify-between px-margin h-[56px] active:bg-surface-container-high transition-colors border-b border-outline-variant/30">
<span class="text-body text-on-surface">Theme</span>
<div class="flex items-center gap-2">
<span class="text-body text-on-surface-variant">System Default</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Row: Code Style -->
<button class="w-full flex items-center justify-between px-margin h-[56px] active:bg-surface-container-high transition-colors">
<span class="text-body text-on-surface">Editor Syntax</span>
<div class="flex items-center gap-2">
<span class="font-code text-label-caps text-primary bg-surface-container-low px-2 py-1 rounded">Parchment</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
</div>
<!-- Section: About -->
<div class="mt-8">
<div class="px-margin mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">ABOUT</span>
</div>
<div class="bg-surface-container-lowest border-y border-outline-variant shadow-sm">
<button class="w-full flex items-center justify-between px-margin h-[56px] active:bg-surface-container-high transition-colors border-b border-outline-variant/30">
<span class="text-body text-on-surface">Terms of Service</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="open_in_new">open_in_new</span>
</button>
<button class="w-full flex items-center justify-between px-margin h-[56px] active:bg-surface-container-high transition-colors border-b border-outline-variant/30">
<span class="text-body text-on-surface">Privacy Policy</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="open_in_new">open_in_new</span>
</button>
<div class="flex items-center justify-between px-margin h-[56px]">
<span class="text-body text-on-surface">Version</span>
<span class="font-code text-label-caps text-on-surface-variant">v2.4.12-STABLE</span>
</div>
</div>
</div>
<!-- Logout Action -->
<div class="mt-12 px-margin pb-12">
<button class="w-full h-[56px] flex items-center justify-center border-2 border-error/20 bg-error/5 text-error font-h3 rounded-lg active:scale-95 transition-all duration-150">
                LOG OUT
            </button>
<p class="text-center mt-6 text-label-caps text-on-surface-variant opacity-60">
                © 2024 AlgoQuest Academic Labs
            </p>
</div>
</main>
<!-- Bottom Navigation (Hidden on Settings pages usually, but kept for context as requested in general shared components rule if it were a top level, however prompt implies "full-screen mobile settings view" often used as a sub-page. I will skip it to prioritize content canvas as per "Relevance Check" rules.) -->
<script>
        // Simple toggle interaction logic if needed (handled by CSS primarily)
        document.querySelectorAll('.toggle-checkbox').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                // Future implementation for state persistence
                console.log('Setting changed:', e.target.checked);
            });
        });
    </script>
</body></html>
