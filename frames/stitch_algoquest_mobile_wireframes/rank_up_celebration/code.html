<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>AlgoQuest - Rank Up!</title>

                    "tertiary": "#7e446f",

                    "primary-container": "#5a7a3a",
                    "surface-container-low": "#f4f4eb",
                    "surface": "#fafaf1",
                    "on-primary-container": "#e5ffc6",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        
        .parchment-grid {
            background-color: #f5f4ef;
            background-image: radial-gradient(#1c1917 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            background-position: 0 0;
            background-attachment: fixed;
            opacity: 1;
        }

        .parchment-grid::before {
            content: "";
            position: absolute;
            inset: 0;
            background-color: #1c1917;
            opacity: 0.04;
            pointer-events: none;
        }

        @keyframes gold-spin {
            0% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 0px #fdc34d); }
            50% { transform: rotate(180deg) scale(1.1); filter: drop-shadow(0 0 15px #fdc34d); }
            100% { transform: rotate(360deg) scale(1); filter: drop-shadow(0 0 0px #fdc34d); }
        }

        @keyframes particle-rise {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .animate-gold-spin {
            animation: gold-spin 4s linear infinite;
        }

        .particle {
            position: absolute;
            bottom: -20px;
            width: 4px;
            height: 4px;
            background: #fdc34d;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-rise linear infinite;
        }

        .overlay-dark {
            background-color: rgba(26, 28, 23, 0.92);
            backdrop-filter: blur(8px);
        }

        .rank-strikethrough {
            position: relative;
            display: inline-block;
        }
        .rank-strikethrough::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: #ba1a1a;
            transform: translateY(-50%) rotate(-5deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-background parchment-grid min-h-screen relative overflow-hidden">
<!-- Content Placeholder (Simulated Background Screen) -->
<main class="p-margin opacity-40">
<div class="space-y-lg">
<div class="h-40 w-full bg-surface border border-outline-variant rounded-xl shadow-sm"></div>
<div class="grid grid-cols-2 gap-md">
<div class="h-32 bg-surface border border-outline-variant rounded-xl"></div>
<div class="h-32 bg-surface border border-outline-variant rounded-xl"></div>
</div>
<div class="h-64 w-full bg-surface border border-outline-variant rounded-xl"></div>
</div>
</main>
<!-- Full-screen Rank Up Overlay -->
<div class="fixed inset-0 z-[100] overlay-dark flex flex-col items-center justify-center p-margin text-center">
<!-- Particle Container -->
<div class="absolute inset-0 overflow-hidden pointer-events-none" id="particle-field"></div>
<!-- Top Celebration Header -->
<div class="relative z-10 space-y-md mb-xl flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center animate-gold-spin mb-xs">
<span class="material-symbols-outlined text-[40px] text-on-secondary-container" data-icon="military_tech" style="font-variation-settings: 'FILL' 1;">military_tech</span>
</div>
<h1 class="font-h1 text-h1 text-secondary-container tracking-tighter">RANK UP!</h1>
<div class="flex items-center gap-md">
<span class="font-code text-body text-outline rank-strikethrough">Coder</span>
<span class="material-symbols-outlined text-primary" data-icon="trending_flat">trending_flat</span>
<span class="font-h3 text-h3 text-primary-fixed-dim font-bold">Problem Solver</span>
</div>
</div>
<!-- Center Medal & Info -->
<div class="relative z-10 w-full max-w-sm">
<div class="bg-surface border border-outline-variant rounded-xl p-xl shadow-lg relative overflow-hidden group">
<!-- Inner Sunken Effect -->
<div class="absolute inset-0 bg-surface-container-low opacity-20 pointer-events-none"></div>
<div class="relative space-y-md">
<div class="w-32 h-32 mx-auto rounded-full bg-secondary-fixed flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-[72px] text-on-secondary-container" data-icon="workspace_premium" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<div class="space-y-base">
<h2 class="font-h2 text-h2 text-on-surface">Problem Solver</h2>
<p class="font-body-sm text-on-surface-variant uppercase tracking-widest">Level 2 Achievement</p>
</div>
<div class="inline-flex items-center gap-xs px-md py-xs bg-secondary-container rounded-full text-on-secondary-container">
<span class="material-symbols-outlined text-h3" data-icon="stars" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-stat-lg text-stat-lg">+250 XP</span>
</div>
</div>
<!-- Abstract Decorative Lines (Technical Feel) -->
<div class="absolute top-0 right-0 w-16 h-16 border-t-2 border-r-2 border-outline-variant opacity-30 -mr-4 -mt-4"></div>
<div class="absolute bottom-0 left-0 w-16 h-16 border-b-2 border-l-2 border-outline-variant opacity-30 -ml-4 -mb-4"></div>
</div>
</div>
<!-- Call to Action -->
<div class="relative z-10 mt-xl w-full max-w-xs">
<button class="w-full h-tap_target bg-primary-container text-on-primary-container font-h3 text-h3 rounded-lg shadow-md transition-all duration-200 active:scale-95 hover:opacity-90 flex items-center justify-center gap-xs">
<span>AWESOME!</span>
<span class="material-symbols-outlined" data-icon="celebration">celebration</span>
</button>
<p class="mt-md font-label-caps text-label-caps text-outline uppercase">Press anywhere to continue</p>
</div>
</div>
<!-- Hidden Navigation Shell Logic (Suppressed for Success Screen) -->
<script>
        // Particle Generator for Gold Burst
        const container = document.getElementById('particle-field');
        const particleCount = 60;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize properties
            const size = Math.random() * 4 + 2;
            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 5;
            const opacity = Math.random() * 0.5 + 0.5;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `-${delay}s`;
            particle.style.opacity = opacity;
            
            // Varied shades of gold
            const goldColors = ['#fdc34d', '#ffdea6', '#f7bd48', '#b8860b'];
            particle.style.backgroundColor = goldColors[Math.floor(Math.random() * goldColors.length)];

            container.appendChild(particle);
        }

        // Simple click-to-dismiss logic (UX placeholder)
        document.body.addEventListener('click', () => {
            console.log('Celebration dismissed');
            // Logic to navigate back to dashboard
        });
    </script>
</body></html>
